apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ingress-nginx-services-alerts.rules
  namespace: ingress-nginx
  labels:
    release: prometheus-ingress-nginx
spec:
  groups:
  - name: Ingress-Nginx-frontend--phoenix-app
    rules:
    - alert: NginxHighHttp4xxErrorRatePhoenix
      expr: sum(rate(nginx_ingress_controller_requests{status=~"4..",ingress="frontend--phoenix-app"}[1m])) / sum(rate(nginx_ingress_controller_requests{ingress="frontend--phoenix-app"}[1m])) * 100 > 5
      for: 2m
      labels:
        slack: ingress-nginx
        severity: critical
        ingress: frontend--phoenix-app
      annotations:
        summary: Nginx high HTTP 4xx error rate (ingress {{ $labels.ingress }})
        description: Too many HTTP requests with status 4xx (> 5%)

    - alert: NginxHighHttp5xxErrorRatePhoenix
      expr: sum(rate(nginx_ingress_controller_requests{status=~"^5..", ingress="frontend--phoenix-app"}[1m])) / sum(rate(nginx_ingress_controller_requests{ingress="frontend--phoenix-app"}[1m])) * 100 > 1
      for: 2m
      labels:
        slack: ingress-nginx
        severity: critical
        ingress: frontend--phoenix-app
      annotations:
        summary: Nginx high HTTP 5xx error rate (ingress {{ $labels.ingress }})
        description: Too many HTTP requests with status 5xx (> 1%)

    - alert: NginxLatencyP99HighPhoenix
      expr: histogram_quantile(0.99, sum by (le)(rate(nginx_ingress_controller_request_duration_seconds_bucket{ingress="frontend--phoenix-app"}[1m]))) > 5
      for: 2m
      labels:
        slack: ingress-nginx
        severity: critical
        ingress: frontend--phoenix-app
      annotations:
        summary: Nginx latency high (ingress {{ $labels.ingress }})
        description: Nginx p99 latency is higher than 5 seconds

    - alert: NginxLatencyP95HighPhoenix
      expr: histogram_quantile(0.95, sum by (le)(rate(nginx_ingress_controller_request_duration_seconds_bucket{ingress="frontend--phoenix-app"}[1m]))) > 1
      for: 2m
      labels:
        slack: ingress-nginx
        severity: critical
        ingress: frontend--phoenix-app
      annotations:
        summary: Nginx latency high (ingress {{ $labels.ingress }})
        description: Nginx p95 latency is higher than 1 seconds

    - alert: NginxLatencyP50HighPhoenix
      expr: histogram_quantile(0.5, sum by (le)(rate(nginx_ingress_controller_request_duration_seconds_bucket{ingress="frontend--phoenix-app"}[1m]))) > 0.1
      for: 1m
      labels:
        slack: ingress-nginx
        severity: critical
        ingress: frontend--phoenix-app
      annotations:
        summary: Nginx latency high (ingress {{ $labels.ingress }})
        description: Nginx p50 latency is higher than 100 milliseconds

