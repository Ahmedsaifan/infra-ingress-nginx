apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ingress-nginx-alerts.rules
  namespace: ingress-nginx
  labels:
    release: prometheus-ingress-nginx
spec:
  groups:
  - name: Ingress-Nginx
    rules:
    - alert: NginxHighHttp4xxErrorRate
      expr: sum(rate(nginx_ingress_controller_requests{status=~"4..",}[1m])) / sum(rate(nginx_ingress_controller_requests{}[1m])) * 100 > 5
      for: 2m
      labels:
        severity: critical
        slack: ingress-nginx
      annotations:
        summary: Nginx high HTTP 4xx error rate (instance {{ $labels.instance }})
        description: Too many HTTP requests with status 4xx (> 5%)

    - alert: NginxHighHttp5xxErrorRate
      expr: sum(rate(nginx_ingress_controller_requests{status=~"^5..",}[1m])) / sum(rate(nginx_ingress_controller_requests{}[1m])) * 100 > 1
      for: 2m
      labels:
        severity: critical
        slack: ingress-nginx
      annotations:
        summary: Nginx high HTTP 5xx error rate (instance {{ $labels.instance }})
        description: Too many HTTP requests with status 5xx (> 1%)

    - alert: NginxLatencyP99High
      expr: histogram_quantile(0.99, sum by (le)(rate(nginx_ingress_controller_request_duration_seconds_bucket[1m]))) > 5
      for: 2m
      labels:
        severity: critical
        slack: ingress-nginx
      annotations:
        summary: Nginx latency high (instance {{ $labels.instance }})
        description: Nginx p99 latency is higher than 5 seconds

    - alert: NginxLatencyP95High
      expr: histogram_quantile(0.95, sum by (le)(rate(nginx_ingress_controller_request_duration_seconds_bucket[1m]))) > 1
      for: 2m
      labels:
        severity: critical
        slack: ingress-nginx
      annotations:
        summary: Nginx latency high (instance {{ $labels.instance }})
        description: Nginx p95 latency is higher than 1 seconds

    - alert: NginxLatencyP50High
      expr: histogram_quantile(0.5, sum by (le)(rate(nginx_ingress_controller_request_duration_seconds_bucket[1m]))) > 0.1
      for: 1m
      labels:
        severity: critical
        slack: ingress-nginx
      annotations:
        summary: Nginx latency high (instance {{ $labels.instance }})
        description: Nginx p50 latency is higher than 100 milliseconds